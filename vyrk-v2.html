<style>

main{max-width:1100px;margin:0 auto;padding:26px 24px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;padding:16px 28px;font:800 17px "Manrope",sans-serif;color:var(--dk);background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 10px 30px -10px var(--ac);cursor:pointer;transition:transform .15s,box-shadow .15s}

.mu{color:var(--mu)}

svg.fig{width:100%;max-height:430px}
.sil{fill:#2a2e39;stroke:#151a26;stroke-width:1}

.h3{font-size:22px;margin:22px 0 12px}

.exc ol{margin:8px 0;padding-left:20px;font-size:14px}

.fb{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.fb button.on{background:var(--ac);color:var(--dk)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.col4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cl{display:flex;align-items:center;gap:12px;border:1px solid #1d2638;background:var(--row);border-radius:16px;padding:13px 16px;color:var(--tx);font:700 15px "Manrope",sans-serif;cursor:pointer;text-align:left}
.cl i{width:20px;height:20px;border-radius:50%}
.plan{position:relative}
.plan.rec{border:2px solid var(--ac)}
.plan h3{font-size:22px;margin:20px 0 10px}
.price{font:800 42px "Archivo",sans-serif;font-stretch:125%}.price small{font:500 15px "Manrope";color:var(--mu)}
.plan ul{list-style:none;padding:0;margin:18px 0 28px;display:grid;gap:12px;font-size:15px}
.plan li::before{content:"✓";color:var(--ac);margin-right:12px;font-weight:800}
.plan li:first-child{font-weight:800}
.badge{position:absolute;right:24px;top:24px;background:var(--ac);color:var(--dk);border-radius:99px;padding:5px 14px;font-weight:800;font-size:13px}
.hl{display:block;border:1px solid #1d2638;border-radius:18px;padding:14px 18px;background:var(--row);margin-bottom:10px}
input.t{width:100%;padding:13px;border-radius:14px;border:1px solid #222c42;background:var(--row);color:var(--tx);font:16px "Manrope",sans-serif;margin:6px 0 14px}
.play header,.play nav{display:none}
@media(max-width:760px){header{padding:12px 16px}nav{position:fixed;left:0;right:0;bottom:0;background:#070d18;border-top:1px solid var(--bd);justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}body{padding-bottom:70px}.two,.cols,.exs{grid-template-columns:1fr}.cols{gap:28px}.exc{flex-direction:column}.tile{width:100%;height:190px}main{padding:20px 16px 40px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function figure(id){const [A,B]=PO[X[id][2]],an=(i,t)=>RM?"":`<animate attributeName="${t}" values="${A[i]};${B[i]};${A[i]}" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .2 1;.4 0 .2 1"/>`;
 // indices : h0 s2 p4 a6 k8 f10
 const ln=(a,b,col)=>`<line x1="${A[a]}" y1="${A[a+1]}" x2="${A[b]}" y2="${A[b+1]}" stroke="${col}" stroke-width="8" stroke-linecap="round">${an(a,"x1")}${an(a+1,"y1")}${an(b,"x2")}${an(b+1,"y2")}</line>`;
 return `<svg viewBox="0 0 200 140" role="img" aria-label="${X[id][0]}"><line x1="10" y1="124" x2="190" y2="124" stroke="#3a4a66" stroke-width="3" stroke-linecap="round"/>${ln(4,8,"#f4f7fb")}${ln(8,10,"#f4f7fb")}${ln(2,6,"#f4f7fb")}${ln(2,4,"var(--ac)")}<circle cx="${A[0]}" cy="${A[1]}" r="9" fill="#f4f7fb">${an(0,"cx")}${an(1,"cy")}</circle></svg>`}
function stats(){const h=hist(),n=Date.now(),w=h.filter(x=>n-x.t<6048e5).length,m=h.filter(x=>n-x.t<2592e6).reduce((a,x)=>a+x.dur,0);return `<div class="stats"><div class="stat"><b>${w} séance${w>1?"s":""}</b><span>Cette semaine</span></div><div class="stat"><b>${m} min</b><span>Minutes (30 j)</span></div><div class="stat"><b>${h.length}</b><span>Total</span></div></div>`}
function hl(h){return h.map(x=>`<div class="hl"><b>${x.m.map(k=>M[k]).join(", ")}</b><div class="mu">${new Date(x.t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · ${x.fmt} · ${x.dur} min${x.fb?" · "+x.fb:""}</div></div>`).join("")}
function gen(fi){const f=FM[fi],ids=[];for(let r=0;r<3;r++)for(const k of ORDER)if(S.sel.has(k)&&MU[k][r]&&!ids.includes(MU[k][r]))ids.push(MU[k][r]);
 const ex=ids.slice(0,6),tours=Math.max(1,Math.floor(S.dur*60/(ex.length*(f[2]+f[3]))));S.ses={fmt:f[0],desc:f[1],e:f[2],r:f[3],dur:S.dur,level:S.level,m:ORDER.filter(k=>S.sel.has(k)),ex,tours};location.hash="#seance"}
const V={
accueil(){const h=hist().slice(0,3);return `<section class="hero"><span class="eb">100 % poids du corps · zéro matériel</span><h1>Choisis tes muscles. On crée ton entraînement.</h1><p class="mu" style="max-width:560px">Bienvenue ! Tu débutes ? Parfait. Touche les zones que tu veux renforcer, choisis ton temps, et lance une séance adaptée, à la maison.</p><div class="row"><a class="btn" href="#creer">Créer ma séance</a><button class="btn dk" id="quick">⚡ Séance express</button><a class="btn dk" href="#historique">Mon historique</a></div></section>${stats()}<div class="card"><h3 style="font-size:22px">Essaie : touche un muscle <span class="mu" id="cnt" style="font:500 15px Manrope">${S.sel.size} sélectionnés</span></h3>${bodies()}${chips()}</div><div class="card" style="margin-top:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,var(--card)),var(--card))"><span class="eb">Coach adaptatif vyrk</span><h2 style="font-size:28px;margin:8px 0">Ta prochaine séance, pensée pour toi</h2><p class="mu">Après chaque séance, dis-nous si c’était trop facile ou trop dur. Le coach choisit les muscles reposés depuis 48 h et ajuste ton niveau et ta durée, pour progresser sans te blesser.</p><a class="btn sm" href="#abonnement">Débloquer avec un abonnement</a></div><h2 style="font-size:26px;margin:30px 0 12px">Séances récentes</h2>${h.length?hl(h):'<p class="mu">Aucune séance pour l’instant. Ta première séance apparaîtra ici une fois terminée.</p>'}`},
creer(){const ok=S.sel.size>0,rdy=ok&&S.dur;return `<h1 style="font-size:clamp(32px,6vw,46px)">Créer ma séance</h1><p class="mu">1. Touche les muscles à travailler · 2. Règle ta séance</p><div class="two" style="margin-top:20px"><div class="card"><h3 style="font-size:20px;margin-bottom:6px">Groupes musculaires</h3>${bodies()}<div class="lgd"><span><i style="background:var(--ac)"></i>Sélectionné</span><span><i style="background:#555c6b"></i>Disponible</span></div><b style="font-size:14px">Ou choisis dans la liste :</b>${chips()}</div><div class="card"><h3 style="font-size:22px;margin-bottom:12px">Niveau</h3>${["Débutant","Intermédiaire","Expérimenté"].map(l=>`<button class="opt${S.level===l?" on":""}" data-l="${l}">${l}<span>${S.level===l?"✓":""}</span></button>`).join("")}<h3 style="font-size:22px;margin:22px 0 12px">Durée</h3><div class="dur" id="dur">${[10,15,20,30].map(d=>`<button data-d="${d}" class="${S.dur===d?"on":""}"${ok?"":" disabled"}>${d} min</button>`).join("")}</div><h3 style="font-size:22px;margin:22px 0 12px">Format</h3><p id="hint" class="mu" style="font-size:13px;margin:-4px 0 12px"${rdy?" hidden":""}>Choisis au moins un muscle et une durée pour débloquer les formats.</p><div id="fm">${FM.map((f,i)=>`<button class="fmt" data-f="${i}"${rdy?"":" disabled"}><b>${f[0]}</b><span>${f[1]}</span></button>`).join("")}</div></div></div>`},
seance(){const s=S.ses;if(!s)return V.creer();return `<span class="eb">${s.fmt} · ${s.dur} min · ${s.level}</span><h1 style="font-size:clamp(34px,7vw,56px);margin:8px 0">Ta séance est prête</h1><p class="mu" style="margin:0">${s.m.map(k=>M[k]).join(" · ")}</p><p class="mu" style="margin:2px 0 20px;font-size:14px">${s.desc} · ${s.tours} tour(s)</p><div class="row"><button class="btn" id="play">▷ Commencer</button><button class="btn dk" id="again">↻ Autres exercices</button></div><div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.5"/></svg>Va à ton rythme. Arrête-toi immédiatement en cas de douleur ou de malaise. Ces conseils ne remplacent pas l’avis d’un professionnel de santé.</div><div class="exs">${s.ex.map((id,i)=>{const e=X[id],st=e[3].split("|");return `<div class="card exc"><div class="tile">${figure(id)}</div><div><span class="eb" style="font-size:12px">EXERCICE ${i+1}</span><h3>${e[0]}</h3><div class="mu" style="font-size:14px">${e[1]}</div><ol>${st.map(t=>`<li>${t}</li>`).join("")}</ol><small><b style="color:var(--ac)">Plus facile :</b> ${e[4]}</small></div></div>`}).join("")}</div>`},
jouer(){return ""},
fin(){return `<div class="fin"><div class="em">🎉</div><h1 style="font-size:36px;margin:10px 0">Séance terminée !</h1><p class="mu">${getU()?"Bravo ! Ta séance est enregistrée dans ton historique.":"Bravo ! C’était ta séance gratuite. Redirection vers les abonnements…"}</p><div class="card"><b>Comment c’était ?</b><div class="mu" style="font-size:13px">Ton coach vyrk adapte ta prochaine séance.</div><div class="fb" id="fb">${["Trop facile","Parfait","Trop dur"].map(f=>`<button class="${S.fb===f?"on":""}" data-fb="${f}">${f}</button>`).join("")}</div></div><a class="btn" style="width:100%;margin-bottom:12px" href="#abonnement">Voir les abonnements</a><a class="btn dk" style="width:100%" href="#accueil">Accueil</a></div>`},
historique(){const h=hist();return `<h1 style="font-size:clamp(32px,6vw,46px)">Historique</h1>${stats()}${h.length?hl(h):'<p class="mu">Aucune séance pour l’instant. Ta première séance apparaîtra ici une fois terminée.</p>'}`},
profil(){const c=+(()=>{try{return localStorage.getItem("vyrk:c")}catch(e){return 0}})()||0;return `<h1 style="font-size:clamp(32px,6vw,46px);margin-bottom:34px">Mon compte</h1><div class="cols"><div><h3 style="font-size:22px;margin-bottom:12px">👤 Informations personnelles</h3>${getU()?`<p><b>${esc(getU().name)}</b><br><span class="mu">${esc(getU().email)}</span></p><button class="btn dk sm" id="logout">Se déconnecter</button>`:`<p class="mu">Mode invité</p><a class="btn sm" href="#connexion">Créer un compte ou se connecter</a>`}</div><div><h3 style="font-size:22px;margin-bottom:16px">Couleurs de l’application</h3><div class="col4" id="cls">${CL.map((x,i)=>`<button class="cl" data-c="${i}"><i style="background:${x[1]}"></i>${x[0]}<span>${i===c?"✓":""}</span></button>`).join("")}</div><hr style="border:0;border-top:1px solid var(--bd);margin:30px 0 22px"><div style="color:var(--ac);font-size:22px">♛</div><h3 style="font-size:20px;margin:8px 0 14px">vyrk Premium</h3><a class="btn dk sm" href="#abonnement">Mon abonnement</a></div></div>`},
connexion(){return `<div style="max-width:420px;margin:30px auto"><h1 style="font-size:36px;margin-bottom:18px">Connexion</h1><div class="card"><label>Prénom<input class="t" id="lu" autocomplete="given-name" placeholder="Ton prénom"></label><label>E-mail<input class="t" id="le" type="email" autocomplete="email" placeholder="toi@exemple.fr"></label><p id="lerr" style="color:#ff8a80;margin:0 0 10px;min-height:20px"></p><button class="btn" id="login" style="width:100%">Se connecter</button><p class="mu" style="font-size:13px;margin-bottom:0">Pas encore de compte ? Il est créé automatiquement. Il reste enregistré sur cet appareil, sans mot de passe : un vrai compte demande un serveur.</p></div></div>`},
abonnement(){const pl=(n,p,li,rec)=>`<div class="card plan${rec?" rec":""}"><span style="color:var(--ac);font-size:24px">${rec?"♛":"🏋"}</span>${rec?'<span class="badge">Offre recommandée</span>':""}<h3>vyrk ${n}</h3><div class="price">${p} € <small>/ mois</small></div><div class="eb" style="margin-top:6px">Premier mois gratuit</div><ul>${li.map(l=>`<li>${l}</li>`).join("")}</ul><a class="btn${rec?"":" dk"}" style="width:100%" href="#connexion">Se connecter pour s’abonner →</a><p class="mu" style="font-size:12px;margin:14px 0 0">Après le mois gratuit : ${p} €/mois jusqu’à résiliation.</p></div>`;
 return `<div style="max-width:900px;margin:0 auto"><span class="eb">vyrk · ABONNEMENTS</span><h1 style="font-size:clamp(32px,6vw,46px);margin:8px 0">Mon abonnement</h1><p class="mu">Deux offres mensuelles. Le premier mois est gratuit, dans les deux formules.</p><div class="cols" style="gap:22px;margin-top:26px">${pl("BASIC","2,99",["3 entraînements par semaine","Débutant, Intermédiaire et Expérimenté","Séances personnalisées selon tes muscles","Accès aux exercices et au chronomètre"],0)}${pl("PREMIUM","4,99",["Entraînements illimités","Toutes les fonctionnalités de BASIC","Débutant, Intermédiaire et Expérimenté","Séances personnalisées selon tes muscles","Accès aux exercices et au chronomètre"],1)}</div><p class="mu" style="text-align:center;font-size:14px;margin-top:28px">🛡 Mensuels · Sans engagement · Résiliables à tout moment · Paiement sécurisé par Stripe</p></div>`}};
let P=null,tm=null,snd=true;
const fmt=t=>Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
function beep(){if(!snd)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.15)}catch(e){}}
function startPlay(){const s=S.ses,q=[];for(let t=0;t<s.tours;t++)s.ex.forEach(id=>{q.push([id,"EFFORT",s.e,t]);q.push([id,"REPOS",s.r,t])});q.pop();P={q,i:0,t:q[0][2],paused:false,total:q.reduce((a,x)=>a+x[2],0),done:0};clearInterval(tm);tm=setInterval(tick,1000);location.hash="#jouer"}
function paintPlay(){const s=S.ses,st=P.q[P.i],id=st[1]==="REPOS"?P.q[P.i+1][0]:st[0],e=X[id];
 $("#app").innerHTML=`<div class="player"><div class="pt"><button class="ib" id="quit" aria-label="Quitter">✕</button><span>${s.fmt} · Tour ${st[3]+1}/${s.tours}</span><button class="ib" id="snd" aria-label="Son">${snd?"🔊":"🔇"}</button></div><div class="pb"><i id="pb" style="width:${P.done/P.total*100}%"></i></div><span class="ph">${st[1]}</span><div class="big">${figure(id)}</div><div class="mu" style="margin-top:14px;font-size:14px">${e[1]}</div><h2 style="font-size:clamp(22px,5vw,32px);margin:4px 0">${e[0]}</h2><div class="timer" id="tm">${fmt(P.t)}</div><p class="mu" style="font-size:14px;max-width:420px;margin:0 auto 20px">${e[3].split("|")[0]} · Plus facile : ${e[4]}</p><div class="row" style="justify-content:center"><button class="btn" id="pz">${P.paused?"▷ Reprendre":"❚❚ Pause"}</button><button class="btn dk" id="skip">Passer</button><button class="btn dk" id="stop">▢ Terminer</button></div></div>`}
function tick(){if(location.hash!=="#jouer"){clearInterval(tm);return}if(!P||P.paused)return;P.t--;P.done++;if(P.t<=0)return next();$("#tm").textContent=fmt(P.t);$("#pb").style.width=P.done/P.total*100+"%"}
function next(){beep();if(P.i>=P.q.length-1)return finish();P.done+=P.t>0?P.t:0;P.i++;P.t=P.q[P.i][2];paintPlay()}
function finish(){clearInterval(tm);const h=hist();h.unshift({t:Date.now(),m:S.ses.m,dur:S.ses.dur,fmt:S.ses.fmt,fb:""});setHist(h);S.fb="";location.hash="#fin";if(!getU())setTimeout(()=>{if(location.hash==="#fin")location.hash="#abonnement"},14000)}
function render(){const r=(location.hash||"#accueil").slice(1),k=V[r]?r:"accueil";
 document.body.className=k==="jouer"?"play":"";
 {const u=getU(),p=$("#pill");p.textContent=u?"👤 "+u.name:"Connexion";p.href=u?"#profil":"#connexion"}
 $("#nav").innerHTML=[["accueil","Accueil"],["creer","Créer"],["historique","Historique"],["profil","Compte"]].map(([h,l])=>`<a href="#${h}" class="${h===k||(h==="creer"&&k==="seance")||(h==="profil"&&k==="abonnement")?"on":""}">${l}</a>`).join("");
 if(k==="jouer"){if(!P||!S.ses){location.hash="#creer";return}paintPlay()}else{if(k==="seance"&&!S.ses){location.hash="#creer";return}$("#app").innerHTML=V[k]()}
 window.scrollTo(0,0)}
function sync(){document.querySelectorAll(".mz,.chip[data-m]").forEach(z=>{const on=S.sel.has(z.dataset.m);z.classList.toggle("on",on);z.setAttribute("aria-pressed",on)});const n=$("#cnt");if(n)n.textContent=S.sel.size+" sélectionnés";if($("#dur")){const ok=S.sel.size>0;document.querySelectorAll("#dur button").forEach(b=>b.disabled=!ok);document.querySelectorAll("#fm button").forEach(b=>b.disabled=!(ok&&S.dur));const hn=$("#hint");if(hn)hn.hidden=!!(ok&&S.dur)}}
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(x=c("[data-m]")){const k=x.dataset.m;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);sync();return}
 if(x=c("[data-l]")){S.level=x.dataset.l;render();return}
 if(x=c("[data-d]")){S.dur=+x.dataset.d;document.querySelectorAll("#dur button").forEach(b=>b.classList.toggle("on",+b.dataset.d===S.dur));sync();return}
 if(x=c("[data-f]")){gen(+x.dataset.f);return}
 if(x=c("[data-c]")){setColor(+x.dataset.c);render();return}
 if(x=c("[data-fb]")){S.fb=x.dataset.fb;const h=hist();if(h[0]){h[0].fb=S.fb;setHist(h)}document.querySelectorAll("#fb button").forEach(b=>b.classList.toggle("on",b.dataset.fb===S.fb));return}
 if(c("#login")){const n=$("#lu").value.trim(),m=$("#le").value.trim().toLowerCase();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$("#lerr").textContent="Entre ton prénom et un e-mail valide.";return}S.u={name:n,email:m};try{localStorage.setItem("vyrk:u",JSON.stringify(S.u))}catch(e){}if(location.hash==="#creer")render();else location.hash="#creer";return}
 if(c("#logout")){S.u=null;try{localStorage.removeItem("vyrk:u")}catch(e){}render();return}
 if(c("#quick")){if(!S.sel.size){S.sel.add("chest");S.sel.add("abs")}if(!S.dur)S.dur=15;gen(3);return}
 if(c("#play"))return startPlay();
 if(c("#again")){const s=S.ses,pool=[];S.sel.forEach(k=>MU[k].forEach(i=>pool.includes(i)||pool.push(i)));s.ex=pool.sort(()=>Math.random()-.5).slice(0,6);render();return}
 if(c("#pz")){P.paused=!P.paused;$("#pz").textContent=P.paused?"▷ Reprendre":"❚❚ Pause";return}
 if(c("#skip")){P.done+=P.t;P.t=0;next();return}
 if(c("#stop"))return finish();
 if(c("#quit")){clearInterval(tm);location.hash="#seance";return}
 if(c("#snd")){snd=!snd;$("#snd").textContent=snd?"🔊":"🔇"}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("mz")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
